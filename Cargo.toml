[workspace]
resolver = "3"
members = ["crates/*", "destro-tui"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "fs", "signal"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
futures-core = "0.3.32"
futures-util = "0.3.32"
parking_lot = "0.12.5"
memchr = "2.8.3"
regex = "1.13.2"
ignore = "0.4.32"
globset = "0.4.19"
unicode-width = "0.2.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-tls", "http2", "stream", "json"] }
